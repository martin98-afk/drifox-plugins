name: Update Downloads

# 定时从计数服务拉取插件下载量，回写 marketplace.json 的 downloads 字段
# （配合客户端安装上报，实现「自动统计下载量」）
#
# 流程：
#   1. tools/fetch_downloads.py   拉取计数 → 更新 downloads_cache.json
#   2. tools/generate_marketplace.py  注入 downloads 字段 → 重新生成 marketplace.json
#   3. 有变化则提交 push（[skip ci] 防循环触发）

on:
  schedule:
    # 每 30 分钟一次，保证下载量及时回写
    - cron: "*/30 * * * *"
  workflow_dispatch: # 手动触发

# 防止并发运行导致 marketplace.json 冲突
concurrency:
  group: update-downloads
  cancel-in-progress: true

jobs:
  update-downloads:
    name: 拉取下载量并回写 marketplace.json
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN || secrets.DRIFOX_BOT_TOKEN }}
          persist-credentials: false

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 拉取下载量并提交（自动处理并发冲突）
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "drifox-bot"
          git config user.email "drifox-bot@users.noreply.github.com"
          TOKEN="${{ secrets.GITHUB_TOKEN || secrets.DRIFOX_BOT_TOKEN }}"
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          MAX_ATTEMPTS=5
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "=== 第 $i 次尝试 ===" >&2

            # 先同步到远程最新，避免与 auto-regenerate / 手动提交并发冲突
            git fetch origin "$TARGET_BRANCH"
            git reset --hard "origin/$TARGET_BRANCH"

            # 基于最新代码拉取下载量并重新生成 marketplace.json（幂等）
            python tools/fetch_downloads.py
            python tools/generate_marketplace.py

            # 无变化则直接结束
            if git diff --quiet marketplace.json downloads_cache.json; then
              echo "ℹ️ 下载量无变化，无需提交" >&2
              exit 0
            fi

            git add marketplace.json downloads_cache.json
            git commit \
              -m "chore(marketplace): update plugin download stats [skip ci]" \
              -m "由 GitHub Actions 从计数服务自动拉取。"

            if git push origin "HEAD:$TARGET_BRANCH"; then
              echo "✅ push 成功" >&2
              exit 0
            fi
            echo "⚠️ push 被拒（存在并发提交），重试..." >&2
            sleep 5
          done

          echo "❌ 多次重试后仍 push 失败，请人工检查" >&2
          exit 1
