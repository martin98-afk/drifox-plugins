name: Release Plugin Tarballs

# 插件升版本后自动构建并发布单插件 tarball（含该平台依赖）
#
# 触发：push 到 main（插件或构建脚本有改动）
# 判定：marketplace.json 里已启用 tarball 通道的插件，版本与已发布包不一致 → 发布
#      未启用 tarball 的插件（新插件首次）仍需手动跑 build + publish + generate
#
# 安全策略：
#   1. --strict-deps：任一插件缺依赖即构建失败，不发残缺包
#   2. concurrency 串行且不取消：发布中途取消会留下半上传的 release
#   3. 提交 marketplace.json 带 [skip ci]：避免自触发循环
#   4. 提交前 pull --rebase + 重试：与 validate.yml 的 auto-fix 并发写清单时防冲突
on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "tools/build_plugin_tarballs.py"
      - "tools/publish_plugin_tarballs.py"
      - "tools/detect_plugin_changes.py"
  workflow_dispatch:
    inputs:
      force:
        description: "强制重打全部已启用 tarball 的插件（忽略版本比对）"
        type: boolean
        default: false
      only:
        description: "只处理指定插件（逗号分隔，留空=按检测结果）"
        type: string
        default: ""

concurrency:
  group: release-tarballs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 tarball
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 检测版本变更
        id: detect
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            LIST="${{ inputs.only }}"
          elif [ "${{ inputs.force }}" = "true" ]; then
            LIST=$(python tools/detect_plugin_changes.py --all)
          else
            LIST=$(python tools/detect_plugin_changes.py)
          fi
          echo "list=${LIST}" >> "$GITHUB_OUTPUT"
          if [ -z "$LIST" ]; then
            echo "无插件版本变更，跳过构建与发布"
          else
            echo "待发布插件: $LIST"
          fi

      - name: 构建 tarball（严格模式）
        if: steps.detect.outputs.list != ''
        run: |
          python tools/build_plugin_tarballs.py \
            --deps-source pip \
            --strict-deps \
            --only "${{ steps.detect.outputs.list }}" \
            --index-url https://pypi.org/simple

      - name: 发布到 GitHub Releases
        if: steps.detect.outputs.list != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/publish_plugin_tarballs.py --only "${{ steps.detect.outputs.list }}" --replace

      - name: 更新 marketplace.json
        if: steps.detect.outputs.list != ''
        run: python tools/generate_marketplace.py

      - name: 提交清单（带重试，容忍并发写入）
        if: steps.detect.outputs.list != ''
        run: |
          git config user.name "drifox-bot"
          git config user.email "drifox-bot@users.noreply.github.com"
          git add marketplace.json
          if git diff --cached --quiet; then
            echo "marketplace.json 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(marketplace): tarball 自动发布 ${{ steps.detect.outputs.list }} [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "清单已推送"
              exit 0
            fi
            echo "push 冲突，重试 $i/3"
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "连续 3 次推送失败，请检查分支保护或并发写入" >&2
          exit 1
