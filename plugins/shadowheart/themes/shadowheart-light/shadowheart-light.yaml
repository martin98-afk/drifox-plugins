name: '影心 · 浅'
id: shadowheart-light
mode: light

window:
  gradient_start: rgba(240, 231, 222, 255)
  gradient_end: rgba(225, 214, 203, 255)

backgrounds:
  window:
    animation:
      src: ../../assets/chat.webp
      canvas: shared
      fps: 15
      fit: cover
      opacity: 1.0
    enabled: true

  sidebar:
    color: rgba(222, 213, 205, 145)
    enabled: true

  scene:
    color: rgba(0, 0, 0, 0)
    enabled: true

  music:
    tracks:
      - ../../assets/01-bgm.mp3
      - ../../assets/02-bgm.mp3
    volume: 0.45
    loop: true
    fade_ms: 420
    enabled: true

