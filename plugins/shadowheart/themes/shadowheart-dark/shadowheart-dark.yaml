# 影心（深色）· Wallpaper Engine 2876343399 转制
# 动画为完整一轮转制的动画 WebP，Qt 内置解码，不依赖系统媒体栈
name: 影心
id: shadowheart-dark
mode: dark

window:
  gradient_start: rgba(11, 11, 13, 255)
  gradient_end: rgba(26, 24, 26, 255)

backgrounds:
  window:
    animation:
      src: ../../assets/chat.webp
      canvas: shared
      fps: 15
      fit: cover
      opacity: 1.0
    enabled: true

  sidebar:
    color: rgba(62, 48, 34, 140)
    enabled: true

  scene:
    color: rgba(0, 0, 0, 0)
    enabled: true

  music:
    tracks:
      - ../../assets/01-bgm.mp3
      - ../../assets/02-bgm.mp3
    volume: 0.45
    loop: true
    fade_ms: 420
    enabled: true

