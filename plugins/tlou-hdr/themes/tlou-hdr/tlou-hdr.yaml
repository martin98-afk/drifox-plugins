# 最后生还者 HDR（深色）· Wallpaper Engine 824558660 转制
# 动画为完整一轮转制的动画 WebP，Qt 内置解码，不依赖系统媒体栈
name: '最后生还者 HDR'
id: tlou-hdr
mode: dark

window:
  gradient_start: rgba(12, 13, 12, 255)
  gradient_end: rgba(25, 28, 23, 255)

backgrounds:
  window:
    animation:
      src: ../../assets/chat.webp
      canvas: shared
      fps: 15
      fit: cover
      opacity: 1.0
    enabled: true

  sidebar:
    color: rgba(48, 52, 28, 140)
    enabled: true

  scene:
    color: rgba(0, 0, 0, 0)
    enabled: true

  music:
    tracks:
      - ../../assets/bgm.mp3
    volume: 0.45
    loop: true
    fade_ms: 420
    enabled: true

