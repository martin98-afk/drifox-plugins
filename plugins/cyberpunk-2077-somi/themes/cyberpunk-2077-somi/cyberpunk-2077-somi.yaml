name: 赛博朋克·Somi 深
id: cyberpunk-2077-somi
mode: dark

window:
  gradient_start: rgba(10, 8, 14, 255)
  gradient_end: rgba(20, 12, 18, 255)

background:
  window_bg:
    image: :/icons/fox_bg.png
    opacity: 0.03
    enabled: true
  chat_list:
    image: :/icons/fox_bg.png
    opacity: 0.03
    enabled: true

backgrounds:
  # 主场景图：Cyberpunk 2077 红灯室（3962×1800 原图缩至 2560 宽）
  scene:
    image: ../../assets/bg.jpg
    opacity: 1.0
    dim: rgba(8, 6, 12, 0.42)
    enabled: true

  # 角色剪影（87% 透明的 PNG，锚在对话区底部居中，像站在对话内容后面）
  decorations:
    - id: somi-silhouette
      image: ../../assets/somi-deco.png
      anchor: scene_bottom
      offset: [0, 40]
      opacity: 0.55
      fit_width: true
      fit_height: true

  # 红光流动覆盖层：本壁纸是 scene 类型（无 mp4），不挂 overlay。
  # 想加动态光影时，在 shared/ 放一段视频并补 overlay.target + overlay.video 即可。

  # 主题音乐：三首 Cyberpunk 2077 OST，跨主题共用
  music:
    tracks:
      - ../../assets/01-never-fade-away.mp3
      - ../../assets/02-the-rebel-path.mp3
      - ../../assets/03-gate-k9.mp3
    volume: 0.45
    loop: true
    fade_ms: 420
    enabled: true

