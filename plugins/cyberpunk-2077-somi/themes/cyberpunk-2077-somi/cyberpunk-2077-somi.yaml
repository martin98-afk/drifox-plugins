  card_bg: rgba(18, 14, 24, 232)
  card_bg_solid: rgba(18, 14, 24, 248)
  content_bg: '#120e18'
  border: '#3a2240'
  border_accent: '#ff2e63'
  text_primary: '#e8e2f0'
  text_secondary: rgba(232, 226, 240, 0.66)
