name: "银翼圣焰"
id: "fe-fw"
mode: dark

window:
  gradient_start: "rgba(14, 8, 22, 255)"
  gradient_end: "rgba(6, 4, 12, 255)"

background:
  chat_list:
    image: fe-fw_bg.png
    opacity: 0.14
    enabled: true

colors:
  # ── 1. 基础色（火焰橙红 + 命运紫双色组合，区别于 rdr2 的荒漠橙金） ──
  accent: "#E04A2C"           # 火焰纹章标志橙红
  accent_warm: "#9B7FE0"      # 命运女神·芙托娜紫（与 rdr2 的荒漠暖金完全区分）
  border: "#2E1E3A"           # 紫黑（命运之黑，非 rdr2 的暖褐）
  border_accent: "#C5A0E0"    # 命运紫亮化版
  text_primary: "#F0F2F8"     # 银白（救世主银翼铠甲）
  text_secondary: "rgba(240, 242, 248, 0.72)"
  text_muted: "#8A7E96"
  card_bg: "rgba(26, 16, 38, 232)"
  card_bg_solid: "rgba(26, 16, 38, 250)"
  content_bg: "#1A0F26"       # 深邃紫黑
  hover_bg: "rgba(155, 127, 224, 0.12)"   # 紫色 hover（vs rdr2 红色 hover）
  selected_bg: "rgba(224, 74, 44, 0.30)"  # 火焰橙红 selected
  capsule_bg: "rgba(155, 127, 224, 180)"
  capsule_border: "rgba(197, 160, 224, 200)"

  # ── 2. 全局 UI 基底 ──
  toolbar_bg: "rgba(255, 255, 255, 0.05)"
  divider_color: "rgba(255, 255, 255, 0.06)"
  hover_bg_strong: "rgba(255, 255, 255, 0.10)"
  scrollbar_handle_bg: "rgba(255, 255, 255, 0.20)"
  scrollbar_handle_hover_bg: "rgba(255, 255, 255, 0.30)"
  card_placeholder_text: "#8FA4C2"

  # ── 3. 卡片级语义色 ──
  button_text_on_accent: "#0F0A18"
  status_info: "#7FDBFF"
  status_danger_bg: "rgba(255, 80, 80, 0.8)"
  status_archive_bg: "rgba(155, 127, 224, 0.8)"   # 紫色归档（vs rdr2 紫归档）
  card_bg_dim: "rgba(255, 255, 255, 0.04)"
  archived_card_bg: "rgba(155, 127, 224, 0.08)"
  archived_card_border: "rgba(155, 127, 224, 0.22)"

  # ── 4. 语法高亮色（冷紫色调为主） ──
  syntax_step: "#9B7FE0"      # 紫色步骤（命运线索）
  syntax_tool: "#E0B86C"      # 金色工具
  syntax_success: "#6A9955"
  syntax_error: "#F14C4C"
  syntax_result: "#C5A0E0"    # 紫色结果值

  # ── 5. 标签色 ──
  tag_accent: "#E04A2C"       # 火焰橙红主标签
  tag_accent_text: "#FFD8C2"
  tag_purple: "#B388FF"
  tag_purple_text: "#D1B3FF"
  tag_orange: "#FFB366"
  tag_orange_text: "#FFC999"

  # ── 6. 用户 / AI 卡片色（冷紫 vs 火焰暖橙，区别于 rdr2 的冷蓝vs暖金） ──
  user_card_bg: "rgba(48, 44, 76, 150)"     # 偏紫蓝
  user_card_accent: "#9BB8FF"               # 银色蓝
  user_card_text: "#F0F2F8"
  user_card_muted: "rgba(240, 242, 248, 0.60)"

  assistant_card_bg: "rgba(80, 36, 24, 160)" # 深火焰红
  assistant_card_accent: "#E04A2C"          # 火焰橙红（救世主之焰，vs rdr2 暖金）
  assistant_card_text: "#F5EBD8"
  assistant_card_muted: "rgba(245, 235, 216, 0.60)"

  # ── 7. 智能体按钮 ──
  agent_btn_text: "#A09AAE"
  agent_btn_text_active: "#9B7FE0"          # 命运紫激活
  agent_btn_bg_active: "rgba(155, 127, 224, 0.22)"
  agent_btn_separator: "rgba(46, 30, 58, 150)"

  # ── 8. 输入框 ──
  input_bg_start: "rgba(16, 8, 24, 150)"
  input_bg_end: "rgba(10, 4, 18, 150)"
  input_focus_bg_start: "rgba(28, 16, 40, 220)"
  input_focus_bg_end: "rgba(18, 10, 28, 220)"
  input_text: "#E8E2EE"
  input_focus_text: "#F0F2F8"
  input_border: "#2E1E3A"
  input_focus_border: "#9B7FE0"             # 紫色聚焦（vs rdr2 红色聚焦）
  input_placeholder: "rgba(180, 170, 200, 0.35)"
  input_glow_preset: "platinum"             # 冷紫底色配 platinum 冷峻聚焦

  # ── 8b. 底部工具栏条 ──
  toolbar_strip_bg: "rgba(26, 16, 38, 150)"
  toolbar_strip_border: "#2E1E3A"

  # ── 9. 实时交互卡片 ──
  realtime_border: "#E04A2C"
  realtime_accent: "#F47A52"
  realtime_accent_warm: "#9B7FE0"           # 紫色暖色（替代 rdr2 的暖金）
  realtime_success: "#34D399"
  realtime_error: "#F87171"
  realtime_bg: "rgba(26, 16, 38, 242)"
  realtime_text: "#F0F2F8"
  realtime_text_secondary: "rgba(240, 242, 248, 0.70)"
  realtime_tag_bg: "rgba(155, 127, 224, 0.18)"
  realtime_tag_border: "rgba(155, 127, 224, 0.32)"

  # ── 10. 系统卡片 ──
  system_border: "#2E1E3A"
  system_accent: "#E04A2C"

  # ── 11. 发送按钮渐变（火焰橙红，保持） ──
  send_btn_start: "#E04A2C"
  send_btn_end: "#A8311A"
  send_btn_hover_start: "#F47A52"
  send_btn_hover_end: "#E04A2C"
  send_btn_radius: 8

  # ── 12. 时间线 ──
  timeline_node: "#5A4A6A"
  timeline_node_hover: "#9B7FE0"            # 紫色 hover
  timeline_node_visible: "#34A853"
  timeline_node_selected: "#E04A2C"        # 火焰橙红选中（vs rdr2 通用橙）
  timeline_line: "#2E1E3A"
  timeline_line_progress: "#34A853"

  # ── 13. 上下文圆环 ──
  ring_normal: "#9B7FE0"                    # 紫色圆环（vs rdr2 红色圆环）
  ring_warning: "#F6C453"
  ring_danger: "#FF6B6B"
  ring_compacted: "#9B59B6"

  # ── 14. 分支标签 ──
  branch_label_bg: "rgba(155, 127, 224, 0.15)"
  branch_label_border: "rgba(155, 127, 224, 0.32)"
  window_bg: "rgba(155, 127, 224, 0.04)"