name: 梦境
id: dream-view-dark
mode: dark

window:
  gradient_start: rgba(6, 9, 13, 255)
  gradient_end: rgba(12, 18, 28, 255)

backgrounds:
  window:
    animation:
      src: ../../assets/chat.webp
      canvas: shared
      fps: 15
      fit: cover
      opacity: 1.0
    enabled: true

  sidebar:
    color: rgba(11, 26, 52, 140)
    enabled: true

  scene:
    color: rgba(0, 0, 0, 0)
    enabled: true

  music:
    tracks:
      - ../../assets/01-bgm.mp3
    volume: 0.45
    loop: true
    fade_ms: 420
    enabled: true

