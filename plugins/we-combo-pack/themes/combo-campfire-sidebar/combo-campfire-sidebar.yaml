# 搭配样板 5/5（新缺口）：window.animation（整窗）+ sidebar.animation（窄幅独立）双区动画。
# 全仓首个「侧栏动画」组合。两区用**不同素材**，所以 canvas 必须 independent：
#   shared 会按整窗画布求值，两区缩放比不同就会错位；independent 各按自身矩形 fit/cover。
# 侧栏素材是从源 3840x2160 裁出火光区（crop 960x2160 @x=1280）转的 480x1080 窄幅，
# 保证「看得见火在动」，而不是整窗图被裁到只剩左侧暗角。
# 接缝：426 帧 / 35.5s / 接缝 MAE 0.87 vs 相邻中位 0.51（ratio 1.71），可直接循环。
# 侧栏 color 半透明罩保文字可读；window / sidebar 不支持 blur / dim（_apply_area_bg 不读）。
name: 篝火夜话·侧栏共享画布
id: combo-campfire-sidebar
mode: dark
window:
  gradient_start: rgba(8, 6, 5, 255)
  gradient_end: rgba(18, 13, 10, 255)
backgrounds:
  window:
    animation:
      src: ../../assets/combo-campfire-sidebar/chat.webp
      canvas: shared
      fps: 10
      fit: cover
      position: center
      opacity: 1.0
    enabled: true
  sidebar:
    animation:
      src: ../../assets/combo-campfire-sidebar/campfire-sidebar.webp
      canvas: independent
      fps: 12
      fit: cover
      position: center
      opacity: 0.9
    color: rgba(10, 8, 6, 172)
    enabled: true
  scene:
    color: rgba(0, 0, 0, 0)
    enabled: true
