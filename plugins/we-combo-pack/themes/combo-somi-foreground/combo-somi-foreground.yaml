# 搭配样板 3/4（缺口 G1 + G3）：window.animation 背景动画 + scene.foreground
# 透明前景立绘。前景层与 scene 同矩形同拉伸，人物浮在动画之上、卡片之下。
name: 赛博朋克·透明前景
id: combo-somi-foreground
mode: dark
window:
  gradient_start: rgba(10, 8, 14, 255)
  gradient_end: rgba(20, 12, 18, 255)
backgrounds:
  window:
    animation:
      src: ../../assets/combo-somi-foreground/chat.webp
      canvas: shared
      fps: 15
      fit: cover
      opacity: 1.0
    enabled: true
  sidebar:
    color: rgba(20, 12, 18, 150)
    enabled: true
  scene:
    color: rgba(0, 0, 0, 0)
    foreground:
      image: ../../assets/combo-somi-foreground/foreground.png
      opacity: 0.7
      enabled: true
    enabled: true
