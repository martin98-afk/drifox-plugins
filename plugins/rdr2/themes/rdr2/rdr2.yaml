name: "荒野大镖客"
id: "rdr2"
mode: dark

window:
  gradient_start: "rgba(22, 10, 8, 255)"
  gradient_end: "rgba(8, 4, 4, 255)"

background:
  chat_list:
    image: rdr2_bg.jpg
    opacity: 0.12
    enabled: true

colors:
  # ── 1. 基础色（血红色主导） ──
  accent: "#A12832"
  accent_warm: "#D4883A"
  border: "#3A1E1C"
  border_accent: "#C04A52"
  text_primary: "#F0E6D3"
  text_secondary: "rgba(240, 230, 211, 0.70)"
  text_muted: "#7A685E"
  card_bg: "rgba(28, 16, 14, 230)"
  card_bg_solid: "rgba(28, 16, 14, 250)"
  content_bg: "#1A0E0C"
  hover_bg: "rgba(161, 40, 50, 0.12)"
  selected_bg: "rgba(161, 40, 50, 0.32)"
  capsule_bg: "rgba(161, 40, 50, 180)"
  capsule_border: "rgba(161, 40, 50, 200)"

  # ── 2. 用户 / AI 卡片色（冷vs暖对比） ──
  user_card_bg: "rgba(38, 50, 72, 150)"
  user_card_accent: "#5B8DEF"
  user_card_text: "#F0F4FA"
  user_card_muted: "rgba(240, 244, 250, 0.60)"

  assistant_card_bg: "rgba(70, 40, 28, 150)"
  assistant_card_accent: "#D4883A"
  assistant_card_text: "#F5EDE0"
  assistant_card_muted: "rgba(245, 237, 224, 0.60)"

  # ── 3. 智能体按钮 ──
  agent_btn_text: "#A09088"
  agent_btn_text_active: "#D4883A"
  agent_btn_bg_active: "rgba(212, 136, 58, 0.20)"
  agent_btn_separator: "rgba(58, 30, 28, 150)"

  # ── 4. 输入框 ──
  input_bg_start: "rgba(20, 12, 10, 150)"
  input_bg_end: "rgba(16, 8, 6, 150)"
  input_focus_bg_start: "rgba(28, 16, 14, 220)"
  input_focus_bg_end: "rgba(22, 12, 10, 220)"
  input_text: "#E8DDD0"
  input_focus_text: "#F0E6D3"
  input_border: "#3A1E1C"
  input_focus_border: "#A12832"
  input_placeholder: "rgba(200, 185, 170, 0.35)"

  # ── 4b. 底部工具栏条（与输入卡解耦，独立 token） ──
  toolbar_strip_bg: "rgba(28, 14, 12, 150)"
  toolbar_strip_border: "#3A1E1C"

  # ── 5. 实时交互卡片 ──
  realtime_border: "#A12832"
  realtime_accent: "#C04A52"
  realtime_accent_warm: "#D4883A"
  realtime_success: "#34D399"
  realtime_error: "#F87171"
  realtime_bg: "rgba(28, 16, 14, 242)"
  realtime_text: "#F0E6D3"
  realtime_text_secondary: "rgba(240, 230, 211, 0.70)"
  realtime_tag_bg: "rgba(192, 74, 82, 0.15)"
  realtime_tag_border: "rgba(192, 74, 82, 0.30)"

  # ── 6. 系统卡片 ──
  system_border: "#3A1E1C"
  system_accent: "#A12832"

  # ── 7. 发送按钮渐变 ──
  send_btn_start: "#A12832"
  send_btn_end: "#7A1E28"
  send_btn_hover_start: "#C04A52"
  send_btn_hover_end: "#A12832"

  # ── 8. 时间线 ──
  timeline_node: "#5A3838"
  timeline_node_hover: "#D4883A"
  timeline_node_visible: "#34A853"
  timeline_node_selected: "#FFA500"
  timeline_line: "#3A1E1C"
  timeline_line_progress: "#34A853"

  # ── 9. 上下文圆环 ──
  ring_normal: "#A12832"
  ring_warning: "#F6C453"
  ring_danger: "#FF6B6B"
  ring_compacted: "#9B59B6"

  # ── 10. 分支标签 ──
  branch_label_bg: "rgba(161, 40, 50, 0.15)"
  branch_label_border: "rgba(161, 40, 50, 0.30)"
  window_bg: "rgba(161, 40, 50, 0.04)"
