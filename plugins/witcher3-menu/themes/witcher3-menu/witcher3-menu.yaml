# 巫师3 主菜单（深色）· Wallpaper Engine 818603284 转制
# 动画为完整一轮转制的动画 WebP，Qt 内置解码，不依赖系统媒体栈
name: '巫师3 主菜单'
id: witcher3-menu
mode: dark

window:
  gradient_start: rgba(9, 10, 13, 255)
  gradient_end: rgba(19, 22, 28, 255)

backgrounds:
  window:
    animation:
      src: ../../assets/chat.webp
      canvas: shared
      fps: 15
      fit: cover
      opacity: 1.0
    enabled: true

  sidebar:
    color: rgba(26, 36, 52, 140)
    enabled: true

  scene:
    color: rgba(0, 0, 0, 0)
    enabled: true

  music:
    tracks:
      - ../../assets/bgm.mp3
    volume: 0.45
    loop: true
    fade_ms: 420
    enabled: true

