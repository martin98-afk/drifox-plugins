# 秘境（深色）· Wallpaper Engine 3483582101 转制
# 动画为完整一轮转制的动画 WebP，Qt 内置解码，不依赖系统媒体栈
name: 秘境
id: mystical-landscape
mode: dark

window:
  gradient_start: rgba(11, 12, 13, 255)
  gradient_end: rgba(22, 24, 28, 255)

backgrounds:
