    animation:
      src: ../../assets/chat.webp
      canvas: shared
      fps: 15
      fit: cover
      opacity: 1.0
    enabled: true

  sidebar:
    color: rgba(28, 37, 52, 140)
    enabled: true

  scene:
    color: rgba(0, 0, 0, 0)
    enabled: true

