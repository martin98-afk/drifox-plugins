name: 奶油树影·深
id: crema-leaves-dark
mode: dark
window:
  gradient_start: rgba(26, 19, 12, 255)
  gradient_end: rgba(34, 25, 15, 255)
background:
  window_bg:
    image: :/icons/fox_bg.png
    opacity: 0.05
    enabled: true
  chat_list:
    image: :/icons/fox_bg.png
    opacity: 0.05
    enabled: true
backgrounds:
  chat:
    # 素材同源（HanaAgent LeavesOverlay，Apache-2.0），已转成动画 WebP：
    # Qt 内置解码，不依赖系统媒体栈；480x270 是低频光影，放大无损观感
    animation:
      src: ../leaves-overlay.webp
      blend: overlay
      position: top
      fps: 12
      opacity: 0.24
